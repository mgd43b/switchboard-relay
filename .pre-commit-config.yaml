# Run `pre-commit install` once to enable these on every commit.
# Update hook versions with `pre-commit autoupdate`.
repos:
  # Ruff runs from uv.lock, the same version CI uses, so local formatting and
  # CI can't disagree. Dependabot's pip group bumps it there; the pre-commit
  # group only covers the hooks below.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --extra dev ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --extra dev ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
